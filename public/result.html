<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Reading — Sage of Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #12142B; --plum: #241832; --parchment: #EDE3D0;
    --gold: #C9A227; --gold-bright: #E0BC4A; --lavender: #8C86A3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--void);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,162,39,0.12), transparent);
    color: var(--parchment); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 50px 24px 70px; }
  .nav { text-align: center; margin-bottom: 30px; }
  .wordmark { font-family: 'Fraunces', serif; font-size: 1rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }
  .wordmark span { color: var(--gold); }
  .eyebrow { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); text-align: center; margin-bottom: 16px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-style: italic; font-size: 1.8rem; text-align: center; margin: 0 0 36px; }
  .reading-card {
    background: var(--plum); border: 1px solid rgba(201,162,39,0.18); border-radius: 8px;
    padding: 32px 28px; margin-bottom: 30px;
  }
  .reading-text { font-size: 1rem; line-height: 1.85; color: var(--parchment); white-space: pre-wrap; }
  .again-link {
    display: block; text-align: center; color: var(--lavender); text-decoration: none;
    font-size: 0.9rem; margin-top: 10px;
  }
  .again-link:hover { color: var(--gold); }
  .disclaimer { font-size: 0.78rem; color: var(--lavender); opacity: 0.7; text-align: center; margin-top: 40px; line-height: 1.6; }
  .loading { text-align: center; color: var(--lavender); padding: 60px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><div class="wordmark">Sage <span>of</span> Signs</div></div>
  <div class="eyebrow">Your Reading</div>
  <h1 id="page-title">Your hand has spoken.</h1>

  <div class="reading-card" id="reading-card">
    <div class="reading-text" id="reading-text">Loading…</div>
  </div>

  <a href="/" class="again-link">← Try another reading</a>
  <p class="disclaimer">Sage of Signs is a prototype provided for entertainment purposes only, and is not a substitute for professional advice.</p>
</div>

<script>
(function () {
  const reading = sessionStorage.getItem('sage_reading');
  const textEl = document.getElementById('reading-text');
  const titleEl = document.getElementById('page-title');

  if (!reading) {
    titleEl.textContent = 'No reading found';
    textEl.textContent = "It looks like you reached this page directly. Please go back and upload a palm photo first.";
  } else {
    textEl.textContent = reading;
  }
})();
</script>
</body>
</html>
