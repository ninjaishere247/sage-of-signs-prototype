<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Reading — Sage of Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #12142B; --plum: #241832; --parchment: #EDE3D0;
    --gold: #C9A227; --gold-bright: #E0BC4A; --copper: #B5622E; --lavender: #8C86A3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--void);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,162,39,0.12), transparent);
    color: var(--parchment); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 50px 24px 70px; }
  .nav { text-align: center; margin-bottom: 30px; }
  .wordmark { font-family: 'Fraunces', serif; font-size: 1rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }
  .wordmark span { color: var(--gold); }
  .eyebrow { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); text-align: center; margin-bottom: 16px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-style: italic; font-size: 1.8rem; text-align: center; margin: 0 0 12px; }
  .intro-line {
    font-family: 'Fraunces', serif; font-style: italic; font-size: 1.05rem; line-height: 1.6;
    text-align: center; color: var(--lavender); max-width: 46ch; margin: 0 auto 36px; display: none;
  }

  .keepsake { display: none; justify-content: center; margin-bottom: 34px; }
  .keepsake-frame {
    padding: 8px; background: var(--plum); border: 1px solid rgba(201,162,39,0.25);
    border-radius: 6px; box-shadow: 0 12px 30px -12px rgba(0,0,0,0.5);
    transform: rotate(-1.5deg);
  }
  .keepsake-frame img {
    display: block; width: 130px; height: 130px; object-fit: cover; border-radius: 3px;
    filter: sepia(0.35) saturate(0.85) contrast(1.02);
  }
  .keepsake-caption {
    font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em;
    color: var(--lavender); text-align: center; margin-top: 8px; opacity: 0.75;
  }

  .sections { display: flex; flex-direction: column; gap: 18px; margin-bottom: 30px; }
  .section-card {
    background: var(--plum); border: 1px solid rgba(201,162,39,0.16); border-radius: 8px;
    padding: 26px 26px 24px; opacity: 0; transform: translateY(10px);
    animation: reveal 0.6s ease forwards;
  }
  .section-card:nth-child(1) { animation-delay: 0.1s; }
  .section-card:nth-child(2) { animation-delay: 0.35s; }
  .section-card:nth-child(3) { animation-delay: 0.6s; }
  .section-card:nth-child(4) { animation-delay: 0.85s; }
  @keyframes reveal { to { opacity: 1; transform: translateY(0); } }

  .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-glyph { width: 26px; height: 26px; flex-shrink: 0; color: var(--gold); }
  .section-label {
    font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold); opacity: 0.9;
  }
  .section-text {
    font-family: 'Petit Formal Script', cursive; font-size: 1.35rem; line-height: 1.55;
    color: var(--parchment); letter-spacing: 0.01em;
  }

  .closing-card {
    text-align: center; padding: 8px 20px 0; opacity: 0; animation: reveal 0.6s ease forwards;
    animation-delay: 1.1s; display: none;
  }
  .closing-text {
    font-family: 'Fraunces', serif; font-style: italic; font-size: 1.1rem; line-height: 1.65; color: var(--lavender);
  }

  .again-link {
    display: block; text-align: center; color: var(--lavender); text-decoration: none;
    font-size: 0.9rem; margin-top: 34px;
  }
  .again-link:hover { color: var(--gold); }
  .disclaimer { font-size: 0.78rem; color: var(--lavender); opacity: 0.7; text-align: center; margin-top: 40px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><div class="wordmark">Sage <span>of</span> Signs</div></div>
  <div class="eyebrow">Your Reading</div>
  <h1 id="page-title">Your hand has spoken.</h1>
  <p class="intro-line" id="intro-line"></p>

  <div class="keepsake" id="keepsake">
    <div>
      <div class="keepsake-frame"><img id="keepsake-img" alt="Your uploaded palm photo" /></div>
      <div class="keepsake-caption">— your palm, as read —</div>
    </div>
  </div>

  <div class="sections" id="sections"></div>
  <div class="closing-card" id="closing-card"><p class="closing-text" id="closing-text"></p></div>

  <a href="/" class="again-link">← Try another reading</a>
  <p class="disclaimer">Sage of Signs is a prototype provided for entertainment purposes only, and is not a substitute for professional advice.</p>
</div>

<script>
(function () {
  const reading = sessionStorage.getItem('sage_reading');
  const photo = sessionStorage.getItem('sage_photo_preview');
  const titleEl = document.getElementById('page-title');
  const introEl = document.getElementById('intro-line');
  const sectionsEl = document.getElementById('sections');
  const closingCardEl = document.getElementById('closing-card');
  const closingTextEl = document.getElementById('closing-text');
  const keepsakeEl = document.getElementById('keepsake');
  const keepsakeImg = document.getElementById('keepsake-img');

  const GLYPHS = {
    HEART: '<svg class="section-glyph" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 21 C4 15 2 9 6 6 C9 4 12 5.5 13 8 C14 5.5 17 4 20 6 C24 9 22 15 13 21 Z"/></svg>',
    HEAD: '<svg class="section-glyph" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="13" cy="10" r="6.5"/><path d="M8 21 C8 17 10 15.5 13 15.5 C16 15.5 18 17 18 21"/></svg>',
    LIFE: '<svg class="section-glyph" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 3 C13 3 5 9 5 15 C5 19.5 8.5 23 13 23 C17.5 23 21 19.5 21 15 C21 9 13 3 13 3 Z"/></svg>',
    FATE: '<svg class="section-glyph" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 23 L13 3 M13 3 L8 8 M13 3 L18 8"/></svg>'
  };
  const LABELS = { HEART: 'Heart Line', HEAD: 'Head Line', LIFE: 'Life Line', FATE: 'Fate Line' };
  const ORDER = ['HEART', 'HEAD', 'LIFE', 'FATE'];

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  if (!reading) {
    titleEl.textContent = 'No reading found';
    introEl.style.display = 'block';
    introEl.textContent = "It looks like you reached this page directly. Please go back and upload a palm photo first.";
    render();
    return;
  }

  if (photo) {
    keepsakeImg.src = photo;
    keepsakeEl.style.display = 'flex';
  }

  // Parse ###MARKER### sections. Anything before the first marker is the intro.
  // Anything after the FATE section's content, once a clear paragraph break is found
  // at the end, is treated as the closing thought.
  const markerRegex = /###(HEART|HEAD|LIFE|FATE)###/g;
  const rawParts = reading.split(markerRegex);
  const intro = (rawParts[0] || '').trim();

  const sectionMap = {};
  for (let i = 1; i < rawParts.length; i += 2) {
    const key = rawParts[i];
    const content = (rawParts[i + 1] || '').trim();
    if (key && LABELS[key] && !sectionMap[key]) sectionMap[key] = content;
  }

  const foundAnySection = Object.keys(sectionMap).length > 0;

  if (foundAnySection) {
    if (intro) {
      introEl.style.display = 'block';
      introEl.textContent = intro;
    }

    // Split the FATE section's content into its own text and a trailing closing paragraph,
    // using a double-newline as the boundary if present.
    let fateContent = sectionMap.FATE || '';
    let closing = '';
    const dbl = fateContent.split(/\n\s*\n/);
    if (dbl.length > 1) {
      fateContent = dbl.slice(0, -1).join('\n\n').trim();
      closing = dbl[dbl.length - 1].trim();
      sectionMap.FATE = fateContent;
    }

    let html = '';
    ORDER.forEach(function (key) {
      if (!sectionMap[key]) return;
      html += '<div class="section-card">' +
        '<div class="section-head">' + GLYPHS[key] + '<span class="section-label">' + LABELS[key] + '</span></div>' +
        '<div class="section-text">' + escapeHtml(sectionMap[key]) + '</div>' +
        '</div>';
    });
    sectionsEl.innerHTML = html;

    if (closing) {
      closingCardEl.style.display = 'block';
      closingTextEl.textContent = closing;
    }
  } else {
    // Fallback: markers not found (unexpected model output) — show the raw reading in one card.
    sectionsEl.innerHTML = '<div class="section-card"><div class="section-text">' + escapeHtml(reading) + '</div></div>';
  }

  function render() {}
})();
</script>
</body>
</html>
